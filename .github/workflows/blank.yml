name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Download script
        run: |
          wget https://raw.githubusercontent.com/tpoechtrager/osxcross/refs/heads/master/tools/gen_sdk_package.sh
          chmod +x gen_sdk_package.sh

      - name: Run script
        run: ./gen_sdk_package.sh

      - name: List files
        run: ls -R
